# Configuration proposal only. Importing/syncing this Blueprint can create
# paid resources and initiate a deploy; obtain owner approval first.
services:
  - type: web
    name: freeland
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    numInstances: 1
    plan: 0.5c-512mb
    disk:
      name: freeland-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: APP_ORIGIN
        sync: false
      - key: DB_PATH
        value: /var/data/freeland.sqlite
