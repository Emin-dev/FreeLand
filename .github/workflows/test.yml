name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/*.db
            !/*.db-*
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Build and test the production container with synthetic data
        run: bash scripts/test-container.sh
      - name: Install official Chromium test browser
        run: bunx playwright install --with-deps chromium
      - name: Run synthetic browser smoke tests
        run: bun run test:ui
        env:
          SCREENSHOT_LOGS: '1'
      - name: Save synthetic screenshots and test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
